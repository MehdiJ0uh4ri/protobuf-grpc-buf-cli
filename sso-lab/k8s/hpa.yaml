apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sso-nginx-hpa
  namespace: sso
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sso-nginx
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60   # scale up when avg CPU > 60%
