apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sso-ingress
  namespace: sso
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - sso.local
    secretName: sso-tls
  rules:
  - host: sso.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sso-nginx-svc
            port:
              number: 80
