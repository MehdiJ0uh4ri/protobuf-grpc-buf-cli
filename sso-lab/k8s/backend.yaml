apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-backend
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-backend
  template:
    metadata:
      labels:
        app: auth-backend
    spec:
      containers:
      - name: auth
        image: hashicorp/http-echo
        args:
          - "-text=OK"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: auth-backend-svc
  namespace: sso
spec:
  selector:
    app: auth-backend
  ports:
  - port: 8081       # NGINX calls this
    targetPort: 5678 # The app is actually listening here
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-app
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upstream-app
  template:
    metadata:
      labels:
        app: upstream-app
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo
        args:
          - "-text=Hello from upstream"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-app-svc
  namespace: sso
spec:
  selector:
    app: upstream-app
  ports:
  - port: 3000
    targetPort: 5678 # Match the http-echo default
