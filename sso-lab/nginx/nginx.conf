worker_processes auto;
error_log /var/log/nginx/error.log warn;
# Fixed: /tmp is writable by non-root users
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri","status":$status}';

    access_log /var/log/nginx/access.log json_combined;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        location /nginx_status {
            stub_status;
        }
    }

    server {
        # Fixed: Non-root users must use ports > 1024
        listen 8081;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /auth {
            internal;
            proxy_pass http://auth-backend-svc:8081/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            auth_request /auth;
            error_page 401 = @login_redirect;
            proxy_pass http://upstream-app-svc:3000;
        }

        location @login_redirect {
            return 302 /sso/login?redirect=$request_uri;
        }

        location /sso/ {
            proxy_pass http://auth-backend-svc:8081/;
        }
    }
}